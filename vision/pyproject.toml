[project]
name = "flossy-vision"
version = "0.1.0"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
# Lo que necesita el servicio en producción (app.py).
dependencies = [
    "fastapi>=0.143.0",
    "mediapipe>=1.1.0",
    "numpy",
    "opencv-python>=5.0.0.93",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
# Laboratorio (server.py, detect.py, analyze.py, zones.py): YOLO y PyTorch.
# `uv run` lo instala por defecto; la imagen Docker usa `uv sync --no-dev`.
dev = [
    "ultralytics>=8.4.175",
]
