# flossy: sirve la app y reenvía /api (Node) y /ws (visión, Python) en el MISMO origen,
# que es lo que exigen las passkeys y la cookie de sesión.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket de la cámara: fotogramas JPEG de ~25 KB a ~10 fps.
    location /ws {
        proxy_pass http://vision:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
