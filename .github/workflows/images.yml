# Construye las tres imágenes (amd64 + arm64) y las publica en ghcr.io/<owner>/flossy-{api,vision,web}.
# En PRs solo se construyen (sin publicar). En main: :latest y :sha-<corto>; en tags vX.Y.Z: :X.Y.Z.
name: images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: api
            dockerfile: api/Dockerfile
          - name: vision
            context: vision
            dockerfile: vision/Dockerfile
          - name: web
            context: .
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Los modelos de vision/models van en git LFS. Se cachean para no gastar la cuota de
      # ancho de banda de LFS en cada build.
      - name: LFS object list
        if: matrix.name == 'vision'
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        if: matrix.name == 'vision'
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: LFS pull
        if: matrix.name == 'vision'
        run: git lfs pull

      # arm64 por emulación: solo se instalan wheels ya compilados, así que es rápido.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/flossy-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=ref,event=pr

      # Prueba de humo: arranca MediaPipe dentro de la imagen (amd64) antes de publicar. Las
      # bibliotecas nativas que falten (libEGL, libGLES…) solo fallan al crear los landmarkers.
      - name: Smoke test (vision)
        if: matrix.name == 'vision'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: flossy-vision:smoke
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Run smoke test (vision)
        if: matrix.name == 'vision'
        run: docker run --rm flossy-vision:smoke python -c "import app, flossy_vision as fv; fv.Landmarkers(); assert app.zone_model.ready; print('ok')"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
